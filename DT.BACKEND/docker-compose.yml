version: '3.8'

services:
  users-db:
    image: postgres:16-alpine
    container_name: users-db
    restart: always
    environment:
      POSTGRES_DB: ${USERS_DB_NAME:-users_db}
      POSTGRES_USER: ${USERS_DB_USER:-users_user}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-users_password}
    ports:
      - "5433:5432" # Mapeado al puerto 5433 local para evitar conflictos
    volumes:
      - users_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERS_DB_USER:-users_user} -d ${USERS_DB_NAME:-users_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "log_statement=all", "-c", "log_duration=on"]

  docutesis-db:
    image: postgres:16-alpine
    container_name: docutesis-db
    restart: always
    environment:
      POSTGRES_DB: ${DOCUTESIS_DB_NAME:-docutesis_db}
      POSTGRES_USER: ${DOCUTESIS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DOCUTESIS_DB_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432" # Expone la BD en el puerto 5432 de la máquina local
    volumes:
      - docutesis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCUTESIS_DB_USER:-postgres} -d ${DOCUTESIS_DB_NAME:-docutesis_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "log_statement=all", "-c", "log_duration=on"]

  users:
    build:
      context: ./users
      dockerfile: Dockerfile
    container_name: users-service
    restart: always
    expose:
      - "8086" # Aislado para red interna de Docker (Nginx)
    environment:
      - USERS_DB_HOST=users-db
      - USERS_DB_PORT=5432
      - USERS_DB_NAME=${USERS_DB_NAME:-users_db}
      - USERS_DB_USER=${USERS_DB_USER:-users_user}
      - USERS_DB_PASSWORD=${USERS_DB_PASSWORD:-users_password}
      - COGNITO_ISSUER_URI=${COGNITO_ISSUER_URI:-https://cognito-idp.us-east-1.amazonaws.com/us-east-1_NGnd22Xvg}
    depends_on:
      users-db:
        condition: service_healthy

  docutesis:
    build:
      context: ./docutesis
      dockerfile: Dockerfile
    container_name: docutesis-service
    restart: always
    expose:
      - "8080" # Aislado para red interna de Docker (Nginx)
    environment:
      - DOCUTESIS_DB_HOST=docutesis-db
      - DOCUTESIS_DB_PORT=5432
      - DOCUTESIS_DB_NAME=${DOCUTESIS_DB_NAME:-docutesis_db}
      - DOCUTESIS_DB_USER=${DOCUTESIS_DB_USER:-postgres}
      - DOCUTESIS_DB_PASSWORD=${DOCUTESIS_DB_PASSWORD:-postgrespassword}
      - COGNITO_ISSUER_URI=${COGNITO_ISSUER_URI:-https://cognito-idp.us-east-1.amazonaws.com/us-east-1_NGnd22Xvg}
    depends_on:
      docutesis-db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nginx-gateway
    restart: always
    ports:
      - "9090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - users
      - docutesis

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    ports:
      - "8085:8080" # Cambiado a 8085 para liberar el resto de puertos
    depends_on:
      - users-db
      - docutesis-db

volumes:
  users_postgres_data:
  docutesis_postgres_data: