spring:
  application:
    name: users

  datasource:
    url: jdbc:postgresql://${USERS_DB_HOST:localhost}:${USERS_DB_PORT:5433}/${USERS_DB_NAME:users_db}
    username: ${USERS_DB_USER:users_user}
    password: ${USERS_DB_PASSWORD:users_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_NGnd22Xvg}

server:
  port: 8081

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} | %-5level | ${spring.application.name} | sub=%X{sub:-anonimo} | %logger{40} | %msg%n"
  level:
    org:
      hibernate:
        SQL: DEBUG
        orm:
          jdbc:
            bind: TRACE